# ─────────────────────────────────────────────
#  MediVault Backend – Application Properties
# ─────────────────────────────────────────────

spring.application.name=medivault-backend
server.port=8080

# ── PostgreSQL Database (Postgres.app) ──
spring.datasource.url=jdbc:postgresql://localhost:5432/medivault
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=princybadjatya06
spring.datasource.password=

# ── Flyway Database Migrations (creates & updates schema) ──
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── JPA / Hibernate (validate only against Flyway schema) ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──
app.jwt.secret=mediVaultSuperSecretKey2026ChangeThisInProduction!
app.jwt.expiration-ms=86400000

# ── File Upload (max 25 MB) ──
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ── CORS (allow React dev server) ──
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Google Gemini AI API ──
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
